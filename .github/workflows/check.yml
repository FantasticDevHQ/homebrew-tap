name: Check
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  formula-syntax:
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: '3.3'
      - name: Check formula syntax
        run: find Formula -name '*.rb' -exec ruby -c {} +
      - name: Check whitespace
        run: git show --format= --check HEAD
